# Render Blueprint — deploy with "New > Blueprint" and point it at your repo.
#
# SendTo is stateless: share data lives in MongoDB Atlas and uploaded files live
# in Google Drive, so no persistent disk is needed. Secrets marked `sync: false`
# are asked for in the Render dashboard the first time the Blueprint is applied.

services:
  - type: web
    name: sendto
    runtime: node
    plan: starter
    region: oregon
    # Also builds the React frontend, so `public/` is always fresh on every deploy.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      # Render generates this once and keeps it stable across deploys.
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Encrypts shared text at rest. Generated once and kept stable across deploys.
      # If you change or delete it, text shares saved earlier become unreadable.
      - key: TEXT_ENCRYPTION_KEY
        generateValue: true

      # MongoDB Atlas
      - key: MONGODB_URI
        sync: false

      # Google Drive (run `npm run google:auth` locally to get these)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false

      - key: MAX_FILE_SIZE
        value: "104857600"
      # Total uploaded bytes kept at once (10 GB). Keep it under your Drive quota.
      - key: MAX_TOTAL_STORAGE
        value: "10737418240"
      - key: DEFAULT_EXPIRY_MINUTES
        value: "1440"
